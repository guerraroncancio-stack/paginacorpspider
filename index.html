<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Staff · Spider's</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080d; --card:#111119; --border:#22222f;
    --neon:#ff5a1f; --neon2:#ffb703; --text:#e8e8f0; --muted:#8a8a9a;
    --danger:#ff5c5c; --ok:#1ed760;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Rajdhani',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
    background-image:radial-gradient(circle at 50% 0%, rgba(255,90,31,.15), transparent 50%);
  }

  /* LOGIN */
  .login{width:100%;max-width:420px}
  .login .brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;text-align:center;margin-bottom:10px;letter-spacing:2px}
  .login .brand span{color:var(--neon)}
  .login .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
  .login .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600}
  input{
    background:#0a0a0f;border:1px solid var(--border);border-radius:10px;
    padding:13px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;outline:none;
  }
  input:focus{border-color:var(--neon)}
  button.primary{
    width:100%;padding:15px;border:none;border-radius:12px;
    font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;
    cursor:pointer;color:#0a0a0f;
    background:linear-gradient(90deg,var(--neon),var(--neon2));
    transition:.2s;
  }
  button.primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,90,31,.35)}
  .error{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;min-height:18px}

  /* PANEL */
  .panel{display:none;width:100%;max-width:1100px}
  .panel.show{display:block}
  .panel-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:30px;flex-wrap:wrap;gap:12px;
  }
  .panel-header h1{font-family:'Orbitron',sans-serif;font-size:22px}
  .panel-header h1 span{color:var(--neon)}
  .user-info{font-size:14px;color:var(--muted)}
  .user-info b{color:var(--neon2)}
  .logout{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:10px 16px;border-radius:99px;cursor:pointer;font-weight:700;
    font-size:13px;letter-spacing:1px;transition:.2s;
  }
  .logout:hover{border-color:var(--danger);color:var(--danger)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .bloque{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:22px;display:flex;flex-direction:column;gap:14px;
  }
  .bloque h3{font-family:'Orbitron',sans-serif;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .bloque .hora{color:var(--neon2);font-size:14px;font-weight:700}
  .bloque .meta{color:var(--muted);font-size:13px}

  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row select, .row input[type=text]{
    flex:1;min-width:140px;
  }
  select{
    background:#0a0a0f;border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;outline:none;
  }
  select:focus{border-color:var(--neon)}
  textarea{
    background:#0a0a0f;border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;
    outline:none;resize:vertical;min-height:60px;width:100%;
  }
  textarea:focus{border-color:var(--neon)}

  .btn-sm{
    padding:10px 14px;border-radius:10px;border:none;cursor:pointer;
    font-family:'Orbitron',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;
    color:#0a0a0f;background:linear-gradient(90deg,var(--neon),var(--neon2));
    transition:.2s;
  }
  .btn-sm:hover{transform:translateY(-1px)}
  .btn-sm.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn-sm.ghost:hover{color:var(--text);border-color:var(--neon)}

  .equipos-list{
    border-top:1px dashed var(--border);padding-top:12px;
    display:flex;flex-direction:column;gap:6px;font-size:14px;
  }
  .equipo-item{
    display:flex;justify-content:space-between;align-items:center;
    background:#0a0a0f;border:1px solid var(--border);border-radius:8px;
    padding:8px 12px;
  }
  .equipo-item button{
    background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:14px;
  }
  .equipo-item .idx{color:var(--muted);font-size:12px;margin-right:6px}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:8px}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);
    background:var(--card);border:1px solid var(--ok);color:var(--ok);
    padding:14px 24px;border-radius:12px;font-weight:700;font-size:14px;
    transition:transform .3s;z-index:99;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="loginView">
  <div class="brand">SPIDER'S <span>·</span> STAFF</div>
  <p class="sub">Acceso restringido a organizadores</p>
  <div class="card">
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="user" autocomplete="username" />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="pass" autocomplete="current-password" />
    </div>
    <button class="primary" id="loginBtn">Iniciar sesión</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- ============ PANEL ============ -->
<div class="panel" id="panelView">
  <div class="panel-header">
    <h1>Panel <span>Staff</span></h1>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="user-info">Conectado como <b id="userName"></b> · <span id="userRol"></span></div>
      <button class="logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <div class="grid" id="bloquesContainer"></div>
</div>

<div class="toast" id="toast">Guardado ✓</div>

<script src="data.js"></script>
<script>
  // ================= LOGIN =================
  const LS_KEY = 'spiders_staff_session';

  function guardarSesion(usuario){
    sessionStorage.setItem(LS_KEY, JSON.stringify({
      user: usuario,
      ts: Date.now()
    }));
  }
  function leerSesion(){
    try{
      const raw = sessionStorage.getItem(LS_KEY);
      if(!raw) return null;
      const s = JSON.parse(raw);
      // expira en 4 horas
      if(Date.now() - s.ts > 4*60*60*1000) return null;
      return s.user;
    }catch{ return null; }
  }
  function cerrarSesion(){
    sessionStorage.removeItem(LS_KEY);
    location.reload();
  }

  // ================= RENDER PANEL =================
  function cargarPanel(userKey){
    const staff = STAFF[userKey];
    if(!staff) return;

    document.getElementById('loginView').style.display = 'none';
    document.getElementById('panelView').classList.add('show');
    document.getElementById('userName').textContent = staff.nombre;
    document.getElementById('userRol').textContent = staff.rol;

    const cont = document.getElementById('bloquesContainer');
    cont.innerHTML = staff.bloques.map(id => renderBloqueStaff(id, userKey)).join('');
  }

  function renderBloqueStaff(id, userKey){
    const b = BLOQUES[id];
    const equipos = b.equipos.map((eq, i) => `
      <div class="equipo-item">
        <span><span class="idx">#${i+1}</span> ${eq}</span>
        <button onclick="eliminarEquipo('${id}','${userKey}',${i})" title="Eliminar">✕</button>
      </div>
    `).join('') || '<div class="empty">Sin equipos inscritos aún</div>';

    return `
      <div class="bloque">
        <h3>${b.nombre} <span class="hora">${b.hora}</span></h3>
        <div class="meta">${b.dia} · Org: ${b.orgDefault || '—'}</div>

        <div class="row">
          <select id="estado_${id}" onchange="cambiarEstado('${id}','${userKey}')">
            <option value="libre" ${b.estado==='libre'?'selected':''}>🟢 Libre</option>
            <option value="en_curso" ${b.estado==='en_curso'?'selected':''}>🟡 En curso</option>
            <option value="cerrado" ${b.estado==='cerrado'?'selected':''}>⚪ Cerrado</option>
            <option value="cancelado" ${b.estado==='cancelado'?'selected':''}>🔴 Cancelado</option>
          </select>
        </div>

        <textarea id="notas_${id}" placeholder="Notas internas del bloque (visible en público)"
          onblur="guardarNotas('${id}','${userKey}')">${b.notas || ''}</textarea>

        <div class="equipos-list">
          ${equipos}
        </div>

        <div class="row">
          <input type="text" id="nuevoEq_${id}" placeholder="Nombre del equipo..." maxlength="30" />
          <button class="btn-sm" onclick="agregarEquipo('${id}','${userKey}')">+ Añadir</button>
        </div>
      </div>
    `;
  }

  // ================= ACCIONES =================
  function cambiarEstado(id, userKey){
    const val = document.getElementById('estado_'+id).value;
    BLOQUES[id].estado = val;
    mostrarToast('Estado actualizado');
  }
  function guardarNotas(id, userKey){
    BLOQUES[id].notas = document.getElementById('notas_'+id).value;
    mostrarToast('Notas guardadas');
  }
  function agregarEquipo(id, userKey){
    const input = document.getElementById('nuevoEq_'+id);
    const nombre = input.value.trim();
    if(!nombre) return;
    if(BLOQUES[id].equipos.length >= BLOQUES[id].maxSlots){
      alert('Este bloque ya está lleno.');
      return;
    }
    BLOQUES[id].equipos.push(nombre);
    input.value = '';
    recargarPanel(userKey);
  }
  function eliminarEquipo(id, userKey, idx){
    if(!confirm('¿Eliminar este equipo del bloque?')) return;
    BLOQUES[id].equipos.splice(idx, 1);
    recargarPanel(userKey);
  }
  function recargarPanel(userKey){
    document.getElementById('bloquesContainer').innerHTML =
      STAFF[userKey].bloques.map(id => renderBloqueStaff(id, userKey)).join('');
  }

  function mostrarToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg + ' ✓';
    t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ================= EVENTOS LOGIN =================
  document.getElementById('loginBtn').addEventListener('click', () => {
    const u = document.getElementById('user').value.trim().toLowerCase();
    const p = document.getElementById('pass').value;
    const err = document.getElementById('loginError');

    if(!STAFF[u]){
      err.textContent = 'Usuario no encontrado.';
      return;
    }
    if(STAFF[u].pass !== p){
      err.textContent = 'Contraseña incorrecta.';
      return;
    }
    err.textContent = '';
    guardarSesion(u);
    cargarPanel(u);
  });

  document.getElementById('pass').addEventListener('keydown', e => {
    if(e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);

  // ================= AUTO-LOGIN =================
  window.addEventListener('DOMContentLoaded', () => {
    const activo = leerSesion();
    if(activo && STAFF[activo]) cargarPanel(activo);
  });
</script>
</body>
</html>
